<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class room asset audit - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}?v=2">
</head>
<body>
  <section class="hero">
    <div class="hero-inner">
      <div class="top">
        <div>
          <h1>CLASS ROOM ASSET AUDIT</h1>
          <p class="subtitle">Admin report</p>
        </div>
        <div class="toolbar">
          <button id="refresh" class="btn btn-line">Refresh</button>
          <a class="btn btn-solid" href="/api/export.xlsx">Download Excel</a>
          <a class="btn btn-line" href="/api/export.csv">Download CSV</a>
          <button id="print" class="btn btn-line">Print / PDF</button>
        </div>
      </div>

      <div class="progress">
        <div class="big"><strong id="count">0</strong><span>of <b id="of">17</b> branches submitted</span></div>
        <div class="track" id="track" role="progressbar" aria-label="Branches submitted" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
        <div id="pending" class="pending"></div>
        <p id="updated" class="updated"></p>
      </div>
    </div>
  </section>

  <main class="sheet">
    <h2>Equipment by branch</h2>
    <div class="table-wrap"><table id="sheet" class="matrix"></table></div>

    <h2 class="second">Branch details</h2>
    <div class="table-wrap"><table id="details" class="details"></table></div>
  </main>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form id="edit-form">
      <div class="edit-header">
        <h2 id="edit-title">Edit branch report</h2>
        <button type="button" id="edit-close" class="edit-close" aria-label="Close">×</button>
      </div>
      <div class="edit-fields">
        <label>Branch
          <select name="branch" id="edit-branch" required></select>
        </label>
        <label>Class room count
          <input name="classroom_count" type="number" min="0" required>
        </label>
        <label>HOF name
          <input name="hof_name" type="text" required>
        </label>
        <label>HOF contact number
          <input name="hof_contact" type="tel" required>
        </label>
      </div>
      <h3>Equipment counts</h3>
      <div id="edit-equipment" class="edit-equipment"></div>
      <div class="edit-fields edit-notes">
        <label>Total asset in lab
          <textarea name="lab_assets" rows="3"></textarea>
        </label>
        <label>Suggestions
          <textarea name="suggestions" rows="3"></textarea>
        </label>
      </div>
      <p id="edit-status" class="edit-status" role="status"></p>
      <div class="edit-actions">
        <button type="button" id="edit-cancel" class="edit-button secondary">Cancel</button>
        <button type="submit" class="edit-button primary">Save changes</button>
      </div>
    </form>
  </dialog>

  <script src="{{ url_for('static', filename='admin.js') }}?v=2"></script>
</body>
</html>
